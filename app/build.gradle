plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fari.maktabeh'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fari.maktabeh'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
    }

    signingConfigs {
        release {
            def ks = System.getenv('FARI_KEYSTORE')
            def kp = System.getenv('FARI_KEYSTORE_PASSWORD')
            def ka = System.getenv('FARI_KEY_ALIAS')
            def ap = System.getenv('FARI_KEY_PASSWORD')
            if (ks != null && kp != null && ka != null && ap != null) {
                storeFile file(ks)
                storePassword kp
                keyAlias ka
                keyPassword ap
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // Release builds are signed in CI. The AAB is suitable for Google Play upload.
}
