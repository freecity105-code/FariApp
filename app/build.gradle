plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fari.maktabeh'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fari.maktabeh'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Build a Google Play compatible Android App Bundle (AAB).
    // Final publishing signing is configured in Google Play Console / upload-key setup.
}
