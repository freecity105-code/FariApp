plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fari.maktabeh'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fari.maktabeh'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            // Signed with the standard debug key for this test build so it can be installed directly.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
