name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create CI release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/fari-release.jks" \
            -storepass "fari-build-password" \
            -keypass "fari-build-password" \
            -alias "fari-release" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FariApp, OU=FariApp, O=FariApp, L=Iran, ST=Iran, C=IR"

      - name: Build signed release APK and Play bundle
        env:
          FARI_KEYSTORE: ${{ runner.temp }}/fari-release.jks
          FARI_KEYSTORE_PASSWORD: fari-build-password
          FARI_KEY_ALIAS: fari-release
          FARI_KEY_PASSWORD: fari-build-password
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Verify release signatures and outputs
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APK_SIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: FariApp-version-1.0.3-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

# Signed release build for direct installation and Google Play bundle upload.
