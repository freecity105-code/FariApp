name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Read app version
        run: |
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'/\1/p" app/build.gradle | head -1)
          VERSION_CODE=$(sed -n "s/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\)/\1/p" app/build.gradle | head -1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building FariApp version $VERSION_NAME (code $VERSION_CODE)"

      - name: Create CI release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/fari-release.jks" \
            -storepass "fari-build-password" \
            -keypass "fari-build-password" \
            -alias "fari-release" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FariApp, OU=FariApp, O=FariApp, L=Iran, ST=Iran, C=IR"

      - name: Build signed release APK and Play bundle
        env:
          FARI_KEYSTORE: ${{ runner.temp }}/fari-release.jks
          FARI_KEYSTORE_PASSWORD: fari-build-password
          FARI_KEY_ALIAS: fari-release
          FARI_KEY_PASSWORD: fari-build-password
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Verify release signatures and outputs
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APK_SIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Prepare clearly named release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk "FariApp-${VERSION_NAME}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "FariApp-${VERSION_NAME}-release.aab"
          sha256sum "FariApp-${VERSION_NAME}-release.apk" "FariApp-${VERSION_NAME}-release.aab"

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: FariApp-version-${{ env.VERSION_NAME }}-release
          path: |
            FariApp-${{ env.VERSION_NAME }}-release.apk
            FariApp-${{ env.VERSION_NAME }}-release.aab
          if-no-files-found: error
          retention-days: 90

# Signed release build for direct installation and Google Play bundle upload.
